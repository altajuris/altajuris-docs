name: Deploy Docs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro, porque `exportar_manual.py` tira a data de
          # cada página de `git log -1` no arquivo. Com o checkout raso
          # (padrão, fetch-depth: 1) só existe um commit, e TODA página sai
          # datada de hoje — o campo que deveria fazer página velha parecer
          # velha passa a fazer o contrário, sem erro nenhum aparecer.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx
      - run: npm ci
      - name: Build PowerPoint (copies to static/downloads)
        run: python scripts/build_pptx.py
      - name: Build Docusaurus site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
